name: self-improve

# Gemma improves Morph on a schedule (R-706).
#
#   benchmark -> feedback -> Gemma edits the code -> benchmark -> keep or revert
#
# Each iteration runs in its own git worktree and is merged only if the
# conformance suite passes and the composite score did not regress (R-704).
# Accepted work is pushed to a branch and raised as a PR — a human still decides
# what lands on the default branch.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many improvement cycles to attempt"
        required: false
        default: "3"
      provider:
        description: "Model provider: ollama (local Gemma) or google (hosted Gemma)"
        required: false
        default: "ollama"
      model:
        description: "Model name"
        required: false
        default: "gemma3:4b"
      focus:
        description: "Optional area to steer this run at"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      MORPH_PROVIDER: ${{ inputs.provider || 'ollama' }}
      MORPH_MODEL: ${{ inputs.model || 'gemma3:4b' }}
      MORPH_IMAGE_BACKEND: stub
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ITERATIONS: ${{ inputs.iterations || '3' }}
      FOCUS: ${{ inputs.focus }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Morph
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Configure git
        run: |
          git config user.name "morph-selfimprove"
          git config user.email "morph-selfimprove@users.noreply.github.com"

      - name: Start Ollama and pull Gemma
        if: env.MORPH_PROVIDER == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull "${MORPH_MODEL}"

      - name: Baseline score
        run: |
          python -m bench.runner --output baseline-scorecard.json | tee baseline.txt

      - name: Run the improvement loop
        id: loop
        run: |
          ARGS=(--iterations "${ITERATIONS}" --provider "${MORPH_PROVIDER}" --model "${MORPH_MODEL}")
          if [ -n "${FOCUS}" ]; then ARGS+=(--focus "${FOCUS}"); fi
          python -m selfimprove.loop "${ARGS[@]}" | tee loop-output.json || true

          if git diff --quiet HEAD@{1} HEAD 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Final score
        run: |
          python -m bench.runner --output final-scorecard.json | tee final.txt

      - name: Verify the gate still passes
        run: python -m pytest tests -q

      - name: Push accepted iterations
        id: push
        run: |
          BRANCH="selfimprove/run-${GITHUB_RUN_NUMBER}"
          if [ -z "$(git log origin/${GITHUB_REF_NAME}..HEAD --oneline)" ]; then
            echo "No accepted iterations to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "${BRANCH}"
          git push -u origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE=$(python -c "import json;print(json.load(open('baseline-scorecard.json'))['composite'])")
          AFTER=$(python -c "import json;print(json.load(open('final-scorecard.json'))['composite'])")
          {
            echo "Automated self-improvement run #${GITHUB_RUN_NUMBER}."
            echo
            echo "Composite score: **${BEFORE} → ${AFTER}**"
            echo
            echo '```'
            cat final.txt
            echo '```'
            echo
            echo "Every commit here was produced by Gemma editing Morph through Morph's own"
            echo "agent, accepted only after the conformance suite passed and the score held."
          } > pr-body.md
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${{ steps.push.outputs.branch }}" \
            --title "self-improve: run #${GITHUB_RUN_NUMBER} (${BEFORE} → ${AFTER})" \
            --body-file pr-body.md

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfimprove-run-${{ github.run_number }}
          path: |
            baseline-scorecard.json
            final-scorecard.json
            baseline.txt
            final.txt
            loop-output.json
            selfimprove/history.jsonl
          if-no-files-found: warn
