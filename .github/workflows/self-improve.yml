name: self-improve

# Gemma evolves Morph on GitHub, and commits the result straight to main.
#
#   benchmark -> feedback -> Gemma edits the code -> benchmark -> keep or revert
#
# Each iteration runs in its own git worktree and is merged onto main only if
# the conformance suite passes, no protected file was touched, and the composite
# score did not regress (R-704, R-707). Accepted iterations are pushed to main
# directly — no human in the loop (R-713).
# Gemma's mutation step first generates and filters exact patch proposals; only
# a controller-validated candidate reaches the benchmark (R-722).
#
# What stands between a bad idea and main:
#   1. the iteration's own gate      — tests green, score held, goalposts intact
#   2. a whole-run re-check          — suite and benchmark re-run after the loop
#   3. a post-rebase re-check        — main may have moved; a rebase is a merge
#   4. no force-push, ever           — a race loses to the human, not the bot
#
# To take the loop off main, change `publish_branch` (or set it to a branch name
# like `selfimprove/nightly` and merge by hand).

on:
  # A loop-workflow change should exercise the loop it changed. Restrict this
  # push trigger to this file so bot history/version commits cannot recurse.
  push:
    branches: [main]
    paths:
      - ".github/workflows/self-improve.yml"
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many improvement cycles to attempt"
        required: false
        default: "3"
      provider:
        description: "Model provider: ollama (local Gemma) or google (hosted Gemma)"
        required: false
        default: "ollama"
      model:
        description: "Model name"
        required: false
        default: "gemma3:4b"
      focus:
        description: "Optional area to steer this run at"
        required: false
        default: ""
      publish_branch:
        description: "Branch to commit evolved code to"
        required: false
        default: "main"
      dry_run:
        description: "Run the loop and score it, but publish nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Never two evolutions at once: they would race for main and one would waste
# hours of model time losing the push.
concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    outputs:
      tags: ${{ steps.publish.outputs.tags }}

    env:
      MORPH_PROVIDER: ${{ inputs.provider || 'ollama' }}
      MORPH_MODEL: ${{ inputs.model || 'gemma3:4b' }}
      MORPH_IMAGE_BACKEND: stub
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ITERATIONS: ${{ inputs.iterations || '3' }}
      FOCUS: ${{ inputs.focus }}
      PUBLISH_BRANCH: ${{ inputs.publish_branch || 'main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Evolve the publish branch itself: the loop fast-forwards accepted
          # iterations onto whatever is checked out.
          ref: ${{ inputs.publish_branch || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Morph
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Identify the committer
        run: |
          git config user.name "morph-selfimprove[bot]"
          git config user.email "morph-selfimprove@users.noreply.github.com"

      - name: Start Ollama and pull Gemma
        if: env.MORPH_PROVIDER == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull "${MORPH_MODEL}"

      - name: Record the starting commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The dashboard cannot wait for Pages to redeploy — by then the run it
      # would be showing is over. This pushes the agent's event stream to the
      # `live` branch every few seconds, where raw.githubusercontent.com serves
      # it to the page directly (R-721). It touches no working tree and no
      # branch but `live`; see scripts/publish_live.py.
      - name: Start the live trace publisher
        run: |
          nohup python scripts/publish_live.py --every 15 > /tmp/live-publish.log 2>&1 &
          echo "$!" > /tmp/live-publish.pid

      - name: Evolve
        run: |
          ARGS=(--iterations "${ITERATIONS}" --provider "${MORPH_PROVIDER}" --model "${MORPH_MODEL}")
          if [ -n "${FOCUS}" ]; then ARGS+=(--focus "${FOCUS}"); fi
          python -m selfimprove.loop "${ARGS[@]}" | tee loop-output.json

      # Stop it before the publish steps, then send the final state once more so
      # the page's last frame matches how the run actually ended.
      - name: Stop the live trace publisher
        if: always()
        run: |
          kill "$(cat /tmp/live-publish.pid)" 2>/dev/null || true
          python scripts/publish_live.py --once || true
          tail -20 /tmp/live-publish.log || true

      - name: What changed
        id: changed
        run: |
          COUNT=$(git rev-list --count "${{ steps.base.outputs.sha }}..HEAD")
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "### Accepted iterations: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" -gt 0 ]; then
            git log --oneline "${{ steps.base.outputs.sha }}..HEAD" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Gate 2. Every iteration checked itself, but they compose — re-verify the
      # run as a whole before it goes anywhere near main.
      - name: Re-verify the conformance suite
        if: steps.changed.outputs.count != '0'
        run: python -m pytest tests -q

      - name: Refuse to publish a regression
        if: steps.changed.outputs.count != '0'
        run: |
          python - <<'PY'
          import json, sys
          attempts = json.load(open("loop-output.json"))
          after = json.load(open("selfimprove/scorecard.json"))
          b = attempts[0]["score_before"]
          a = after["composite"]
          print(f"composite {b} -> {a}")
          if after.get("gated"):
              sys.exit("REFUSING: conformance gate is failing")
          if a < b:
              sys.exit(f"REFUSING: composite regressed across the run ({b} -> {a})")
          PY

      # Persist rejected attempts too. Otherwise an all-rejected scheduled run
      # disappears with its runner and Gemma repeats it tomorrow. The publisher
      # commits history plus the real-model scorecard even when no edit passed.
      # Gate 3+4 still rebase, re-run the suite, and never force-push.
      - name: Publish run state to ${{ inputs.publish_branch || 'main' }}
        id: publish
        if: inputs.dry_run != true
        run: |
          python -m selfimprove.publish --branch "${PUBLISH_BRANCH}" --attempts 5 \
            --scorecard selfimprove/scorecard.json \
            --scorecard selfimprove/previous-scorecard.json | tee publish-result.json
          # Tags are created by publishing, after any rebase settled the SHAs.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          data = json.loads(pathlib.Path("publish-result.json").read_text())
          tags = data.get("tags") or []
          print(f"tags={json.dumps(tags)}")
          print(f"any={'true' if tags else 'false'}")
          PY

      - name: Publish (dry run)
        if: inputs.dry_run == true
        run: python -m selfimprove.publish --branch "${PUBLISH_BRANCH}" --dry-run --no-history

      - name: Summarise
        if: always()
        run: |
          {
            echo
            echo '### Scorecard'
            echo '```'
            python -c 'import json; d=json.load(open("selfimprove/scorecard.json")); print("real-model composite: {:.1f}/100".format(d["composite"])); [print("{:13} {:5.1f}/{:.0f}".format(n, c.get("points", 0), c.get("weight", 0))) for n,c in d.get("categories", {}).items()]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfimprove-run-${{ github.run_number }}
          path: |
            loop-output.json
            publish-result.json
            selfimprove/history.jsonl
            selfimprove/progress.json
            selfimprove/scorecard.json
            selfimprove/previous-scorecard.json
            selfimprove/live-trace.jsonl
          if-no-files-found: warn

  # One downloadable, installable release per version the loop cut this run.
  # A reusable workflow rather than a tag trigger: pushes made with GITHUB_TOKEN
  # do not start new workflow runs, so a `push: tags:` trigger would never fire
  # for the bot's own tags.
  release:
    needs: evolve
    if: needs.evolve.outputs.tags != '' && needs.evolve.outputs.tags != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.evolve.outputs.tags) }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}
    secrets: inherit

  # Refresh the public scoreboard with whatever this run produced.
  pages:
    needs: evolve
    if: always() && needs.evolve.result == 'success'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
