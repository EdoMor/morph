name: ci

on:
  push:
    # Everything except the telemetry branch, which a running self-improve job
    # rewrites every fifteen seconds — that would be four CI runs a minute, on a
    # branch containing no code. A GITHUB_TOKEN push does not start a workflow
    # anyway, but this must not depend on remembering that.
    branches-ignore: [live]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # R-801/R-802: the suite must pass with no network and no credentials.
      - name: Conformance suite
        run: python -m pytest tests -q

      - name: Benchmark
        if: matrix.python-version == '3.11'
        # CI validates the harness without a model server. Real Gemma capability
        # is measured by the self-improvement workflow after it starts Ollama.
        run: >-
          python -m bench.runner --provider echo --model echo
          --image-backend stub --output scorecard.json

      - name: Upload scorecard
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.json
